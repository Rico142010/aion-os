services:
  - type: web
    name: aion-studio
    runtime: docker
    region: ohio
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_PATH
        value: /data/aion.db
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CURRENCY
        value: USD
      - key: PAYPAL_PRICE_CREATOR
        value: "19"
      - key: PAYPAL_PRICE_STUDIO
        value: "49"
      - key: PAYPAL_PRODUCT_ID
        value: PROD-6BJ67959FM465384R
      - key: PAYPAL_PLAN_CREATOR
        value: P-77D2068016890371LNK4YA2Y
      - key: PAYPAL_PLAN_STUDIO
        value: P-6AP27737ND149381FNK4YA2Y
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: AI_PROVIDER
        value: openai
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_REDIRECT_URI
        sync: false
      - key: YOUTUBE_TOKEN_ENCRYPTION_KEY
        sync: false
